name: lms-local
services:
  postgres:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_DB: lms_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a generated local administrator password in .env.postgres}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - lms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lms_development"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  lms_postgres_data:
